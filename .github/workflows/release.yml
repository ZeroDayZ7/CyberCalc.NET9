name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rerun, for example v2.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag and version
        shell: pwsh
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG_INPUT)) {
            $env:RELEASE_TAG_INPUT
          } else {
            $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag must use vX.Y.Z" }
          $version = $Matches[1]
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid semantic version: $version"
          }
          $central = (Get-Content -Raw version.txt).Trim()
          if ($central -ne $version) {
            throw "Tag $tag does not match version.txt ($central)"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          $numericVersion = ($version -split '-')[0]
          "NUMERIC_VERSION=$numericVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore WPF-CALC-NET-9.sln -p:Configuration=Release -r win-x64

      - name: Build Release
        run: dotnet build WPF-CALC-NET-9.sln --configuration Release --no-restore

      - name: Prepare clean output directories
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force publish/win-x64 -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force artifacts -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force publish/win-x64, artifacts | Out-Null

      - name: Publish win-x64
        run: >-
          dotnet publish CyberCalc.NET9/WPF-CALC-NET-9.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output publish/win-x64 -p:PublishReadyToRun=true

      - name: Clean developer and debug files
        shell: pwsh
        run: |
          Get-ChildItem publish/win-x64 -Recurse -Include '*.pdb','*.user','*.nupkg','*.snupkg' |
            Remove-Item -Force -ErrorAction Stop
          if (Get-ChildItem publish/win-x64 -Recurse -Include '*.pdb','*.user','*.nupkg','*.snupkg') {
            throw 'Developer or debug files remain in publication'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found' }
          & $iscc '/DAppVersion=${{ env.RELEASE_VERSION }}' '/DNumericVersion=${{ env.NUMERIC_VERSION }}' '/DSourceDir=${{ github.workspace }}\publish\win-x64' '/DOutputDir=${{ github.workspace }}\artifacts' installer/CyberCalc.iss

      - name: Create ZIP
        shell: pwsh
        run: |
          $zip = "artifacts/CyberCalc-$env:RELEASE_VERSION-win-x64.zip"
          Compress-Archive -Path publish/win-x64/* -DestinationPath $zip -CompressionLevel Optimal

      - name: Generate SHA256 sums
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts -File | Where-Object { $_.Extension -ne '.txt' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii "artifacts/CyberCalc-$env:RELEASE_VERSION-SHA256SUMS.txt"

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $installer = "artifacts/CyberCalc-Setup-$env:RELEASE_VERSION-x64.exe"
          $zip = "artifacts/CyberCalc-$env:RELEASE_VERSION-win-x64.zip"
          $sums = "artifacts/CyberCalc-$env:RELEASE_VERSION-SHA256SUMS.txt"
          foreach ($path in @($installer, $zip, $sums)) {
            if (-not (Test-Path $path) -or (Get-Item $path).Length -eq 0) { throw "Missing artifact: $path" }
          }
          $summary = Get-Content $sums
          foreach ($line in $summary) {
            if ($line -match '^([0-9a-f]{64})  (.+)$') {
              $hash = $Matches[1]; $name = $Matches[2]
              $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath "artifacts/$name").Hash.ToLowerInvariant()
              if ($actual -ne $hash) { throw "Checksum mismatch: $name" }
            }
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          $repo = $env:GITHUB_REPOSITORY

          if (-not $tag -or -not $version) {
            throw 'RELEASE_TAG or RELEASE_VERSION was not propagated.'
          }

          $localTag = & git rev-parse --verify "refs/tags/$tag^{commit}" 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Required tag '$tag' is not available in the checkout: $localTag"
          }

          $authOutput = & gh auth status 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub CLI authentication failed. $authOutput"
          }

          $apiOutput = & gh api --method GET "repos/$repo/releases/tags/$tag" 2>&1 | Out-String
          $apiExitCode = $LASTEXITCODE

          if ($apiExitCode -ne 0 -and $apiOutput -match '(?is)(HTTP\s*404|404:\s*Not Found|Status:\s*404)') {
            & gh release create $tag `
              --repo $repo `
              --verify-tag `
              --title "CyberCalc.NET9 $version" `
              --generate-notes `
              "artifacts/CyberCalc-Setup-$version-x64.exe" `
              "artifacts/CyberCalc-$version-win-x64.zip" `
              "artifacts/CyberCalc-$version-SHA256SUMS.txt"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release '$tag'."
            }
            Write-Host "Created GitHub Release '$tag'."
          }
          elseif ($apiExitCode -ne 0) {
            throw "GitHub API failed while checking Release '$tag' (exit $apiExitCode): $apiOutput"
          }
          else {
            Write-Host "GitHub Release '$tag' already exists; checking assets."

            $release = $apiOutput | ConvertFrom-Json
            $existingAssets = @($release.assets | ForEach-Object { $_.name })

            $expectedFiles = @(
              "artifacts/CyberCalc-Setup-$version-x64.exe",
              "artifacts/CyberCalc-$version-win-x64.zip",
              "artifacts/CyberCalc-$version-SHA256SUMS.txt"
            )

            $downloadDir = Join-Path $env:RUNNER_TEMP "existing-release-assets"
            New-Item -ItemType Directory -Force $downloadDir | Out-Null

            foreach ($file in $expectedFiles) {
              $name = [IO.Path]::GetFileName($file)
              if ($existingAssets -contains $name) {
                $existingDownload = Join-Path $downloadDir $name
                if (Test-Path $existingDownload) { Remove-Item -Force $existingDownload }

                & gh release download $tag --repo $repo --pattern $name --dir $downloadDir --clobber
                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to download existing asset '$name' for checksum comparison."
                }

                $existingHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $existingDownload).Hash
                $localHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash
                if ($existingHash -ne $localHash) {
                  throw "Existing asset '$name' differs from the newly built artifact. Refusing to overwrite it."
                }

                Write-Host "Asset '$name' already exists and matches; skipping upload."
                continue
              }

              & gh release upload $tag $file --repo $repo
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to upload missing asset '$name'."
              }
              Write-Host "Uploaded missing asset '$name'."
            }
          }

          $verifiedNames = & gh release view $tag --repo $repo --json assets --jq '.assets[].name' 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to verify GitHub Release '$tag': $verifiedNames"
          }
          foreach ($name in $verifiedNames) {
            if ($name -match '\S') { Write-Host "Verified Release asset: $name" }
          }
